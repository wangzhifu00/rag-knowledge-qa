# ============================================================
# RAG Knowledge QA - 全栈编排
# 组件: app (FastAPI) + PostgreSQL 16 + Redis 7 + Qdrant + Adminer
# 启动: docker compose -f docker/docker-compose.yml up -d --build
# 界面: http://127.0.0.1:8000/ui/
#
# name 显式写死：compose 默认拿「文件所在目录名」当项目名（这里是 docker），
# 一改目录结构数据卷就换名、旧数据全"消失"。锁定成 rag-knowledge-qa，
# 和之前手动敲出来的 rag-knowledge-qa_postgres_data 卷保持对齐。
# ============================================================

name: rag-knowledge-qa

services:

  # ---------- app: FastAPI 应用本体 ----------
  # 一条命令起全栈：docker compose -f docker/docker-compose.yml up -d --build
  app:
    build:
      context: ..                  # 构建上下文是项目根（Dockerfile 在根目录）
      dockerfile: Dockerfile
    image: rag-knowledge-qa:latest
    container_name: rag-app
    restart: unless-stopped

    # 密钥、模型名、LLM 选择都从 .env 来，不烤进镜像
    env_file:
      - ../.env

    environment:
      # ★ 唯一必须覆盖的一组：容器里的 "localhost" 指容器自己，
      #   要连兄弟容器得用服务名。这三个变量把 app 从"连本机"改成"连邻居"。
      #   （pydantic-settings 里环境变量优先级高于 .env 文件，所以这里能盖住）
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      # 容器没接 GPU，auto 会自动退到 CPU；显式写死是为了日志里一眼看得出跑在哪
      EMBEDDING_DEVICE: cpu
      RERANK_DEVICE: cpu
      # CPU 上 fp16 没有加速指令，转了反而更慢，关掉
      GPU_FP16: "false"

    ports:
      - "${APP_PORT:-8000}:8000"

    volumes:
      # 6.5GB 模型不进镜像：只读挂载宿主机目录。
      # 换模型 = 改宿主机 models/ + 跑 reindex，不用 rebuild 镜像。
      - ../models:/app/models:ro
      # 用户上传的 PDF 落在宿主机，否则只存在于容器的可写层里，
      # `up -d --build` 重建容器就没了（PG 里还留着 chunk 原文，问答不受影响，
      # 但 documents.file_path 会指向不存在的文件，重新解析就废了）。
      # 挂载点路径要和代码一致：documents.py 里是 Path(__file__).parents[2]
      # → /app/app/data/uploads，注意多一层 app。
      - ../app/data/uploads:/app/app/data/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    healthcheck:
      # 用 python 自带的 urllib，镜像里就不用为了健康检查装 curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 冷启动要加载 bge-m3 + reranker：CPU 上约 40~60 秒，
      # 给 180 秒宽限期，否则启动阶段会被判定 unhealthy 反复重启
      start_period: 180s

  # ---------- PostgreSQL: 元数据/会话/文档记录 ----------
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis: 缓存 / 队列 / 会话 ----------
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_redis_pwd}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_pwd}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Qdrant: 向量数据库 ----------
  # ⚠ 版本不能随便往上跳：实测 v1.12.4 → v1.20.0 直接启动失败，
  #   segment.json 里的 `on_disk` 字段新版本不认（只认 mmap / in_ram_mmap），
  #   中间几个版本改过存储布局且没有向后兼容迁移。
  #   若要与新版 qdrant-client 对齐，得删卷重建（原文在 PG，跑 reindex 就行），
  #   不能原地升级。
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      # 如需鉴权,取消注释并设置 QDRANT_API_KEY
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Adminer: 数据库可视化(Web UI) ----------
  adminer:
    image: adminer:latest
    container_name: rag-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data: