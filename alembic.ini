# Alembic configuration.
# NOTE: keep this file pure ASCII (no Chinese comments) -- Alembic reads it
# with the system locale encoding (GBK on Chinese Windows) and will crash
# on UTF-8 Chinese characters.
# The sqlalchemy.url is NOT set here; alembic/env.py injects it from
# app.config so the connection string has a single source of truth.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
